server {
  listen 80;
  # API, health and OpenAPI go to the backend with the original path (no prefix stripping)
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location = /health { proxy_pass http://backend:8000; }
  location = /openapi.json { proxy_pass http://backend:8000; }
  location /docs { proxy_pass http://backend:8000; }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
