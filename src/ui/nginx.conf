server {
  listen 80;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  # API, health and OpenAPI go to the backend with the original path (no prefix stripping)
  location /api/ { proxy_pass http://backend:8000; }
  location = /health { proxy_pass http://backend:8000; }
  location = /openapi.json { proxy_pass http://backend:8000; }
  location /docs { proxy_pass http://backend:8000; }
  # sandbox page + Pyodide runtime: loaded by an opaque-origin iframe, hence CORS; never falls back to index.html
  location /sandbox/ {
    root /usr/share/nginx/html;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
